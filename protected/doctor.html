<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Queue</title>
  <link rel="stylesheet" href="/css/doctor.css">
</head>
<body>
  <main class="workbench">
    <header class="topbar">
      <div>
        <p class="eyebrow">Doctor Desk</p>
        <h1 id="doctor-name">Doctor</h1>
      </div>
      <div class="topbar-actions">
        <div class="dept-pill" id="doctor-department">Department</div>
        <button class="btn-logout" id="btn-logout" type="button">Log out</button>
      </div>
    </header>

    <section class="command-grid">
      <article class="now-panel">
        <div class="panel-head">
          <p class="eyebrow">Now Serving</p>
          <span class="status-dot"></span>
        </div>
        <div class="queue-code" id="now-code">--</div>
        <h2 id="now-name">No active patient</h2>
        <p id="now-meta" class="muted">Call the next patient from your department queue.</p>
        <div class="patient-note-box">
          <p class="eyebrow">Patient Note</p>
          <p id="patient-note" class="muted">No patient note available.</p>
        </div>
        <div class="action-row">
          <button class="primary" id="call-next" type="button">Call Next</button>
          <button class="secondary" id="mark-done" type="button" disabled>Mark Done</button>
          <span class="queue-count-pill" id="waiting-count">0 waiting</span>
        </div>
      </article>

      <article class="checklist-panel">
        <div class="panel-head">
          <p class="eyebrow">Normal Check-up Checklist</p>
          <span class="suggestion-state" id="checklist-ai-status">Waiting for active patient</span>
        </div>
        <div class="checklist-list" id="doctor-checklist">
          <label class="check-row"><input type="checkbox" value="concern_reviewed" disabled><span>Patient concern reviewed</span></label>
          <label class="check-row"><input type="checkbox" value="vitals_reviewed" disabled><span>Vital signs reviewed</span></label>
          <label class="check-row"><input type="checkbox" value="symptoms_reviewed" disabled><span>Symptoms reviewed</span></label>
          <label class="check-row"><input type="checkbox" value="history_reviewed" disabled><span>Relevant history/allergies reviewed</span></label>
          <label class="check-row"><input type="checkbox" value="physical_exam_completed" disabled><span>Physical exam completed</span></label>
          <label class="check-row"><input type="checkbox" value="initial_impression_documented" disabled><span>Initial impression documented</span></label>
          <label class="check-row"><input type="checkbox" value="patient_advised" disabled><span>Patient advised</span></label>
        </div>
        <label>
          Additional note
          <textarea id="doctor-checkup-note" rows="3" placeholder="Add details not covered by the checklist" disabled></textarea>
        </label>
      </article>

      <article class="transfer-panel">
        <div class="panel-head">
          <p class="eyebrow">Transfer</p>
        </div>
        <label>
          Target department
          <select id="target-department"></select>
        </label>
        <div class="subdepartment-box" id="subdepartment-options"></div>
        <label>
          Notes
          <textarea id="transfer-notes" rows="3" placeholder="Referral notes"></textarea>
        </label>
        <button class="primary dark" id="transfer-patient" type="button" disabled>Transfer Patient</button>
      </article>
    </section>

    <section class="queue-panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Department Queue</p>
          <h2>Waiting List</h2>
        </div>
        <button class="ghost" id="refresh-queue" type="button">Refresh</button>
      </div>
      <div class="queue-list" id="doctor-queue"></div>
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/js/doctor.js"></script>
</body>
</html>
