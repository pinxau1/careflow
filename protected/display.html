<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareFlow Display</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body class="display-body">
  <main class="display-shell">
    <header class="display-header">
      <div>
        <div class="display-brand">CareFlow</div>
        <div class="display-subtitle">Now Serving</div>
      </div>
      <div class="display-announcer" id="display-announcer">
        <div class="display-announcer-actions">
          <button type="button" class="display-announcer-btn primary" id="announcer-enable-btn">Enable Announcer</button>
          <button type="button" class="display-announcer-btn" id="announcer-mute-btn">Mute</button>
          <button type="button" class="display-announcer-btn" id="announcer-test-btn">Test</button>
        </div>
        <div class="display-announcer-status" id="announcer-status">Announcer off</div>
        <div class="display-announcer-warning" id="announcer-warning" hidden>Text-to-speech is not supported in this browser.</div>
      </div>
      <div class="display-header-meta">
        <div class="display-clock" id="display-clock">--:--:--</div>
        <div class="display-date" id="display-date">--</div>
        <div class="display-updated" id="display-updated">Loading...</div>
      </div>
    </header>

    <section class="display-grid" id="display-grid">
      <div class="empty-state">Loading display...</div>
    </section>
  </main>

  <script src="/js/display.js"></script>
</body>
</html>
